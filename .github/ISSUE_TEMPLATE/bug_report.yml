name: Bug report
description: Report reproducible incorrect behavior without including meeting content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Nook. Do not attach recordings, transcripts,
        credentials, private window titles, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Nook version and build
      placeholder: "1.6.4 (12)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 26.5, MacBook Pro"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Meeting app or browser
      description: Use a generic name and version; redact meeting and organization names.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic content and the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Relevant permissions
      multiple: true
      options:
        - Microphone
        - Speech Recognition
        - Screen & System Audio Recording
        - Notifications
        - None or unknown
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed meeting content, credentials, personal data, and identifying paths.
          required: true
        - label: This is not a security vulnerability; I will use the private reporting route if it is.
          required: true
