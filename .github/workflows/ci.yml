name: Contributor CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: contributor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on stable Xcode 26
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          stable_xcode="$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
              | grep -Ev '(beta|Beta|RC|rc)' \
              | sort \
              | tail -n 1
          )"
          test -n "$stable_xcode"
          sudo xcode-select --switch "$stable_xcode/Contents/Developer"
          xcodebuild -version
          if xcodebuild -version | grep -Eiq '(beta|rc|Xcode 27)'; then
            echo "Contributor CI requires stable Xcode 26." >&2
            exit 1
          fi

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          version='2.45.4'
          expected_sha='090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef'
          archive="$RUNNER_TEMP/xcodegen-$version.zip"
          install_root="$RUNNER_TEMP/xcodegen-$version"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$version/xcodegen.zip" \
            --output "$archive"
          echo "$expected_sha  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      - name: Verify generated project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Nook.xcodeproj

      - name: Test release tooling
        run: python3 -m unittest discover -s Scripts/Tests

      - name: Test contributor configuration
        shell: bash
        run: |
          # Keep the original failure while exposing Swift Testing assertions
          # that xcodebuild -quiet otherwise reduces to a test method name.
          test_result="$RUNNER_TEMP/NookContributorTests.xcresult"
          report_test_failure() {
            local test_status=$?
            if [ "$test_status" -ne 0 ] && [ -d "$test_result" ]; then
              xcrun xcresulttool get test-results summary --path "$test_result" --compact || true
            fi
            exit "$test_status"
          }
          trap report_test_failure EXIT
          xcodebuild test -quiet \
            -project Nook.xcodeproj \
            -scheme Nook \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ContributorDerivedData \
            -resultBundlePath "$test_result" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build contributor configuration
        run: |
          xcodebuild build -quiet \
            -project Nook.xcodeproj \
            -scheme Nook \
            -configuration Release \
            -derivedDataPath .build/ContributorDerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify development identity and disabled updater
        shell: bash
        run: |
          set -euo pipefail
          app='.build/ContributorDerivedData/Build/Products/Release/Nook.app'
          info="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'com.localfirst.nook.dev'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NookOfficialBuild' "$info")" = 'NO'
