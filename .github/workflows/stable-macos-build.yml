name: Maintainer unsigned distribution build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintainer-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build official configuration without credentials
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select stable Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          stable_xcode="$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' \
              | grep -Ev '(beta|Beta|RC|rc)' \
              | sort -V \
              | tail -n 1
          )"
          test -n "$stable_xcode"
          sudo xcode-select --switch "$stable_xcode/Contents/Developer"
          xcode_version="$(xcodebuild -version)"
          echo "$xcode_version"
          if [[ "$xcode_version" != "Xcode 27"* ]] \
            || grep -Eiq '(beta|rc)' <<<"$xcode_version"; then
            echo "Distribution artifacts require stable Xcode 27." >&2
            exit 1
          fi

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          version='2.46.0'
          expected_sha='4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
          archive="$RUNNER_TEMP/xcodegen-$version.zip"
          install_root="$RUNNER_TEMP/xcodegen-$version"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$version/xcodegen.zip" \
            --output "$archive"
          echo "$expected_sha  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          echo "$install_root/xcodegen/bin" >> "$GITHUB_PATH"
          "$install_root/xcodegen/bin/xcodegen" --version

      # The same script a maintainer runs locally when GitHub's images do not
      # yet carry the required Xcode: generate, test, build, verify and zip.
      - name: Build, test and verify the official configuration
        run: ./Scripts/build-distribution-app.sh "$PWD"

      - name: Upload unsigned official-configuration app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Nook-stable-unsigned
          path: |
            Nook-stable-unsigned.zip
            Nook-stable-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 1
