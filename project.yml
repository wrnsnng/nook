name: Nook
options:
  bundleIdPrefix: com.localfirst
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    # Nook's own lagoon teal, so every system-drawn control agrees with the brand
    # colour Nook draws by hand. Without it a window can show two accents at
    # once: the user's system accent on checkboxes, insertion points and
    # bordered buttons, and NookPalette.accent everywhere else. The values in
    # Assets.xcassets/AccentColor.colorset match NookPalette.accentFill.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.23.0"
    CURRENT_PROJECT_VERSION: "42"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"
  # On-device speaker separation (issue #28). Apache-2.0. Its Core ML models
  # are not fetched by the package: Scripts/fetch-diarization-models.sh pins
  # and verifies them at build time, and the app bundles them.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.17.4"
    # No traits: the default NemoTextProcessing trait links a 22 MB text
    # normalizer that only FluidAudio's speech recognition and text-to-speech
    # call. Nook uses its speaker separation alone and transcribes with
    # Apple's Speech framework, which already writes numbers and dates.
    traits: []
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
        excludes:
          - Resources/Brand/NookIconSource.png
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ThirdParty/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: TRADEMARKS.md
        buildPhase: resources
      # A folder reference, so the generated project is identical whether or
      # not the models have been fetched yet. They are gitignored and verified
      # by the pre-build check below.
      - path: ThirdParty/SpeakerDiarizationModels
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: FluidAudio
        product: FluidAudio
    preBuildScripts:
      # Speaker separation must never silently disappear from a build, the
      # way live conversion once did (AGENTS.md rule 2). The app cannot fetch
      # its models at runtime, so a build without them fails here instead.
      - name: Verify speaker diarization models
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          if ! "${SRCROOT}/Scripts/fetch-diarization-models.sh" --check; then
            echo "error: Speaker diarization models are missing or changed. Run Scripts/fetch-diarization-models.sh once, then build again."
            exit 1
          fi
    info:
      path: Nook/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Nook
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAccentColorName: AccentColor
        NSCalendarsFullAccessUsageDescription: "Nook reads your calendar, only on this Mac, to name meetings and remind you before they start."
        NSRemindersFullAccessUsageDescription: "Nook adds an action item to Reminders only when you ask it to."
        NSAudioCaptureUsageDescription: "Nook captures meeting audio from your Mac so it can create a private local transcript."
        NSHumanReadableCopyright: "Copyright © 2026 Common Tools Co."
        NSMicrophoneUsageDescription: "Nook records your microphone so your side of a meeting can be transcribed locally."
        NookOfficialBuild: "$(NOOK_OFFICIAL_BUILD)"
        NSScreenCaptureUsageDescription: "Nook captures a minimal screen stream to record meeting system audio locally."
        NSSpeechRecognitionUsageDescription: "Nook uses on-device speech recognition to turn meeting audio into local notes."
        SUEnableAutomaticChecks: true
        SUFeedURL: "https://github.com/wrnsnng/nook-releases/releases/download/updates/appcast.xml"
        SUPublicEDKey: "apOw6+icVsAh8Emfd1cwAkndoeAV71+anDE/w6rkZM8="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        # Contributor builds deliberately use a separate identity and never
        # start Nook's production updater. release-update.sh opts into the
        # official values explicitly when preparing a signed release.
        PRODUCT_BUNDLE_IDENTIFIER: com.localfirst.nook.dev
        NOOK_OFFICIAL_BUILD: NO
        PRODUCT_NAME: Nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Nook/Nook.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SWIFT_STRICT_CONCURRENCY: complete
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NookSnapshot:
    type: tool
    platform: macOS
    sources:
      - path: Nook
        excludes:
          - App/NookApp.swift
          - App/AppDelegate.swift
          - Resources
      - path: NookSnapshot
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: FluidAudio
        product: FluidAudio
    settings:
      base:
        PRODUCT_NAME: NookSnapshot
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Nook:
    build:
      targets:
        Nook: all
        NookTests: [test]
    test:
      targets:
        - NookTests
      # The test host is the app, and every MarkdownStore first scans the
      # configured library. Without this that is ~/Documents/Nook: a fresh
      # build then waits on the Documents privacy prompt and the whole test
      # run stalls, and tests would read the developer's real notes.
      commandLineArguments:
        "-storageDirectory $(TARGET_TEMP_DIR)/TestLibrary": true
