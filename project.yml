name: Nook
options:
  bundleIdPrefix: com.localfirst
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    # Nook's own cobalt, so every system-drawn control agrees with the brand
    # colour Nook draws by hand. Without it a window can show two blues at
    # once: the user's system accent on checkboxes, insertion points and
    # bordered buttons, and NookPalette.accent everywhere else. The values in
    # Assets.xcassets/AccentColor.colorset match NookPalette.accent.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.20.1"
    CURRENT_PROJECT_VERSION: "37"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.5"
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
        excludes:
          - Resources/Brand/NookIconSource.png
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ThirdParty/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: NOTICE
        buildPhase: resources
      - path: TRADEMARKS.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: Nook/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Nook
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAccentColorName: AccentColor
        NSCalendarsFullAccessUsageDescription: "Nook reads your calendar, only on this Mac, to name meetings and remind you before they start."
        NSRemindersFullAccessUsageDescription: "Nook adds an action item to Reminders only when you ask it to."
        NSAudioCaptureUsageDescription: "Nook captures meeting audio from your Mac so it can create a private local transcript."
        NSHumanReadableCopyright: "Copyright © 2026 Common Tools Co."
        NSMicrophoneUsageDescription: "Nook records your microphone so your side of a meeting can be transcribed locally."
        NookOfficialBuild: "$(NOOK_OFFICIAL_BUILD)"
        NSScreenCaptureUsageDescription: "Nook captures a minimal screen stream to record meeting system audio locally."
        NSSpeechRecognitionUsageDescription: "Nook uses on-device speech recognition to turn meeting audio into local notes."
        SUEnableAutomaticChecks: true
        SUFeedURL: "https://github.com/wrnsnng/nook-releases/releases/download/updates/appcast.xml"
        SUPublicEDKey: "apOw6+icVsAh8Emfd1cwAkndoeAV71+anDE/w6rkZM8="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        # Contributor builds deliberately use a separate identity and never
        # start Nook's production updater. release-update.sh opts into the
        # official values explicitly when preparing a signed release.
        PRODUCT_BUNDLE_IDENTIFIER: com.localfirst.nook.dev
        NOOK_OFFICIAL_BUILD: NO
        PRODUCT_NAME: Nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Nook/Nook.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SWIFT_STRICT_CONCURRENCY: complete
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NookSnapshot:
    type: tool
    platform: macOS
    sources:
      - path: Nook
        excludes:
          - App/NookApp.swift
          - App/AppDelegate.swift
          - Resources
      - path: NookSnapshot
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: NookSnapshot
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Nook:
    build:
      targets:
        Nook: all
        NookTests: [test]
    test:
      targets:
        - NookTests
