name: Nook
options:
  bundleIdPrefix: com.localfirst
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "6"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: Nook/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Nook
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: "$(PRODUCT_BUNDLE_PACKAGE_TYPE)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAudioCaptureUsageDescription: "Nook captures meeting audio from your Mac so it can create a private local transcript."
        NSHumanReadableCopyright: "Copyright © 2026 Common Tools Co. All rights reserved."
        NSMicrophoneUsageDescription: "Nook records your microphone so your side of a meeting can be transcribed locally."
        NSScreenCaptureUsageDescription: "Nook captures a minimal screen stream to record meeting system audio locally."
        NSSpeechRecognitionUsageDescription: "Nook uses on-device speech recognition to turn meeting audio into local notes."
        SUFeedURL: "https://github.com/wrnsnng/nook-releases/releases/download/updates/appcast.xml"
        SUPublicEDKey: "apOw6+icVsAh8Emfd1cwAkndoeAV71+anDE/w6rkZM8="
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localfirst.nook
        PRODUCT_NAME: Nook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Nook/Nook.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SWIFT_STRICT_CONCURRENCY: complete
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nook.app/Contents/MacOS/Nook"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NookSnapshot:
    type: tool
    platform: macOS
    sources:
      - path: Nook
        excludes:
          - App/NookApp.swift
          - App/AppDelegate.swift
          - Resources
      - path: NookSnapshot
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_NAME: NookSnapshot
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Nook:
    build:
      targets:
        Nook: all
        NookTests: [test]
    test:
      targets:
        - NookTests
